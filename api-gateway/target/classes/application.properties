# Identidad y Puerto
spring.application.name=api-gateway
server.port=8080

# Configuración de Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Ruta para AUTH-SERVICE (Sintaxis Webflux para Spring Boot 3.5+)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Ruta para UTILITY-SERVICE (Sintaxis Webflux para Spring Boot 3.5+)
spring.cloud.gateway.server.webflux.routes[1].id=utility-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://UTILITY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/utility/**

# Ruta para TENANT-SERVICE (PUERTO 8085)
spring.cloud.gateway.server.webflux.routes[2].id=tenant-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TENANT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/tenants/**

# Ruta para LEASE-SERVICE (Puerto 8086)
spring.cloud.gateway.server.webflux.routes[3].id=lease-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://LEASE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/leases/**