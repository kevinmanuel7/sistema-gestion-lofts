services:
  tenant-app:
    build: .
    container_name: tenant-service-container
    ports:
      - "8085:8085"
    depends_on:
      tenant-db:
        condition: service_healthy 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://tenant-db:3306/tenant_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_ENABLED: "false"
    restart: on-failure
    networks:
      - loft_network

  tenant-db:
    image: mysql:8.0
    container_name: tenant-db-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tenant_db
    ports:
      - "3310:3306"
    volumes:
      - tenant_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - loft_network

networks:
  loft_network:
    external: true

volumes:
  tenant_db_data: