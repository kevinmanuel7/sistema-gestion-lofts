server.port=8085
spring.application.name=tenant-service

# Configuración de Base de Datos 
spring.datasource.url=jdbc:mysql://tenant-db:3306/tenant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Credenciales definidas en el docker-compose.yml
spring.datasource.username=root
spring.datasource.password=root

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#Configuración de Swagger / OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

