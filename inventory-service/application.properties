spring.application.name=inventory-service

server.port=8084

# Configuración de Base de Datos (Laragon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3312/db_inventory?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ServBay.dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuración de Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html